<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KLECommerce - Register</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div class="login-page">

        <div class="login-container">

            <!-- LEFT SIDE -->
            <div class="login-left">

                <h1>KLECommerce</h1>

                <h2>Join KLECommerce!</h2>

                <p>
                    Create your account and discover
                    amazing products and exciting offers.
                </p>

                <div class="shopping-icon">
                    🛍️
                </div>

                <div class="login-features">

                    <div>✓ Easy Shopping</div>

                    <div>✓ Secure Payments</div>

                    <div>✓ Fast Delivery</div>

                </div>

            </div>


            <!-- RIGHT SIDE -->
            <div class="login-box register-box">

                <h2>Create Account</h2>

                <p class="login-subtitle">
                    Register to start shopping
                </p>


                <form onsubmit="register(event)">

                    <!-- USERNAME -->
                    <label for="registerUsername">
                        Username
                    </label>

                    <div class="input-box">

                        <span>👤</span>

                        <input
                            type="text"
                            id="registerUsername"
                            placeholder="Enter your username"
                            required
                        >

                    </div>


                    <!-- EMAIL -->
                    <label for="registerEmail">
                        Email
                    </label>

                    <div class="input-box">

                        <span>✉️</span>

                        <input
                            type="email"
                            id="registerEmail"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->
                    <label for="registerPassword">
                        Password
                    </label>

                    <div class="input-box">

                        <span>🔒</span>

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Create a password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="toggleRegisterPassword()"
                        >
                            👁
                        </button>

                    </div>


                    <!-- CONFIRM PASSWORD -->
                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="input-box">

                        <span>🔐</span>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="toggleConfirmPassword()"
                        >
                            👁
                        </button>

                    </div>


                    <!-- CREATE ACCOUNT BUTTON -->
                    <button
                        type="submit"
                        class="login-button register-button"
                    >
                        Create Account
                    </button>

                </form>


                <!-- LOGIN LINK -->
                <p class="register-text">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>


                <!-- HOME LINK -->
                <a
                    href="index.html"
                    class="back-home"
                >
                    ← Back to KLECommerce
                </a>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
